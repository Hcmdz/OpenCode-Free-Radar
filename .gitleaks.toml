# Gitleaks config — local pre-push gate for secrets GitHub push protection misses
# (google_api_key, firebase FCM keys and generic passwords have NO push protection).
# Usage: `gitleaks detect --config .gitleaks.toml --no-git` or `gitleaks protect --staged`.
title = "secret scan"

[extend]
useDefault = true

[[rules]]
id = "google-api-key"
description = "Google API key (AIza...)"
regex = '''AIza[0-9A-Za-z_-]{35}'''

[[rules]]
id = "firebase-fcm-key"
description = "Firebase Cloud Messaging legacy server key"
regex = '''AAAA[A-Za-z0-9_:\-]{10,}'''

[[rules]]
id = "gradle-signing-password"
description = "Gradle signing password in clear"
# A quoted literal is a secret. The value must not start with $, which is
# how a reference reads (a shell variable, a workflow expression), and a
# property lookup such as
# providers.gradleProperty("RELEASE_STORE_PASSWORD").get() does not start
# with a quote at all.
regex = '''(?im)"?(storePassword|keyPassword|RELEASE_(?:STORE|KEY)_PASSWORD)"?\s*[=:]\s*"([^"$][^"]*)"'''
secretGroup = 2

[[rules]]
id = "gradle-signing-password-unquoted"
description = "Gradle signing password in clear, unquoted"
# The unquoted form: a properties file, a workflow env entry, an export.
# The value ends the line, which is what tells it apart from a call such as
# providers.gradleProperty("RELEASE_STORE_PASSWORD").get().
regex = '''(?im)"?(storePassword|keyPassword|RELEASE_(?:STORE|KEY)_PASSWORD)"?\s*[=:]\s*([^\s"$]+)([ \t]*(#.*)?)$'''
secretGroup = 2

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''(gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]+)'''

[[rules]]
id = "gh-hosts-yml"
description = "GitHub CLI credentials file"
path = '''hosts\.yml$'''
regex = '''oauth_token\s*:\s*\S+'''

[[allowlists]]
description = "Placeholders used in docs and templates"
# RELEASE_*_PASSWORD is a property name, not a value: a quoted one is the
# secret being named, not disclosed.
regexes = ['''YOUR_[A-Z_]+''', '''EXAMPLE''', '''CHANGEME''', '''xxx''', '''RELEASE_(STORE|KEY)_PASSWORD''']
