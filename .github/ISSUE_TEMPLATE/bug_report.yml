name: Bug Report
description: Report a bug in OpenCode Free Radar
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      description: "e.g. 0.1.0 (Settings > About)"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Pixel device
        - Samsung Galaxy device
        - Other Android device
        - Android emulator
    validations:
      required: true
  - type: input
    id: android
    attributes:
      label: Android Version
      description: "e.g. Android 15 (API 35)"
    validations:
      required: false
