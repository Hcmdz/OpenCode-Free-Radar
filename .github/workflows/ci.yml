name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Configure Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon.idletimeout=600000
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # Constitution rule 10 (English-only): tripwire for French
      # stop-words in code and docs. values-fr/ and values-ar/ hold
      # localized strings and are excluded by design.
      - name: language-gate
        run: |
          ! grep -rInw \
            --include='*.kt' --include='*.kts' \
            --include='*.md' --include='*.xml' \
            --exclude-dir=build --exclude-dir=.git --exclude-dir=.gradle \
            --exclude-dir=values-fr --exclude-dir=values-ar \
            -e 'le' -e 'la' -e 'les' -e 'des' -e 'une' \
            -e 'est' -e 'sont' -e 'dans' -e 'pour' -e 'avec' \
            -e 'sans' -e 'entre' -e 'cette' -e 'ces' -e 'leur' \
            -e 'voici' -e 'chaque' -e 'tous' -e 'moins' -e 'quand' \
            .

  secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: Signing rule self-check
        run: |
          # The signing rule must ignore a value read from the environment and
          # still catch one written down, quoted or not. The fixtures are
          # assembled here so the shapes never sit in this file.
          set -euo pipefail
          command -v gitleaks >/dev/null || { echo "gitleaks is not on PATH"; exit 1; }
          tmp=$(mktemp -d)
          k=storePassword
          mkdir -p "$tmp/lookup" "$tmp/reference" "$tmp/literal" "$tmp/unquoted"
          printf '%s = providers.gradleProperty("RELEASE_STORE_PASSWORD").get()\n' "$k" > "$tmp/lookup/signing.kts"
          printf '%s: ${{ secrets.RELEASE_STORE_PASSWORD }}\n' "$k" > "$tmp/reference/signing.yml"
          printf '%s = "PLACEHOLDERVALUE"\n' "$k" > "$tmp/literal/signing.kts"
          printf '%s: PLACEHOLDERVALUE\n' "$k" > "$tmp/unquoted/signing.yml"
          # gitleaks exits 0 when it finds nothing and 1 when it finds a leak.
          for clean in lookup reference; do
            if gitleaks dir "$tmp/$clean" --config .gitleaks.toml --redact --no-banner >/dev/null 2>&1; then
              echo "$clean is clean"
            else
              echo "false positive: $clean must not be flagged"; exit 1
            fi
          done
          for dirty in literal unquoted; do
            set +e
            gitleaks dir "$tmp/$dirty" --config .gitleaks.toml --redact --no-banner >/dev/null 2>&1
            code=$?
            set -e
            [ "$code" -eq 1 ] || { echo "the gate missed $dirty (exit $code)"; exit 1; }
          done
          echo "signing rule self-check ok"
      - name: No sensitive filenames tracked
        run: |
          # The list is the same file the generic gate and the audit engine read,
          # so the verdict and this gate cannot disagree about a sensitive path.
          NAMES=$(grep -v '^#' .github/sensitive-filenames.txt | grep -v '^$' | paste -sd'|')
          test -n "$NAMES"
          ! git ls-files \
            | grep -iE "$NAMES" \
            | grep -q .
          echo "filenames clean"
