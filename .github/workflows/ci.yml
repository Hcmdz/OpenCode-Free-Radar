name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v4.8.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v4.4.2

      - name: Configure Gradle JVM memory
        run: |
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
          org.gradle.daemon.idletimeout=600000
          EOF

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      # Constitution rule 10 (English-only): tripwire for French
      # stop-words in code and docs. values-fr/ and values-ar/ hold
      # localized strings and are excluded by design.
      - name: language-gate
        run: |
          ! grep -rInw \
            --include='*.kt' --include='*.kts' \
            --include='*.md' --include='*.xml' \
            --exclude-dir=build --exclude-dir=.git --exclude-dir=.gradle \
            --exclude-dir=values-fr --exclude-dir=values-ar \
            -e 'le' -e 'la' -e 'les' -e 'des' -e 'une' \
            -e 'est' -e 'sont' -e 'dans' -e 'pour' -e 'avec' \
            -e 'sans' -e 'entre' -e 'cette' -e 'ces' -e 'leur' \
            -e 'voici' -e 'chaque' -e 'tous' -e 'moins' -e 'quand' \
            .

  secret-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout (full history for secret scan)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - name: No sensitive filenames tracked
        run: |
          # The list is the same file the generic gate and the audit engine read,
          # so the verdict and this gate cannot disagree about a sensitive path.
          NAMES=$(grep -v '^#' .github/sensitive-filenames.txt | grep -v '^$' | paste -sd'|')
          test -n "$NAMES"
          ! git ls-files \
            | grep -iE "$NAMES" \
            | grep -q .
          echo "filenames clean"
